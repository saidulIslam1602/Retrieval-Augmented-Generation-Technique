# Advanced RAG System Configuration
# =====================================

# System Settings
system:
  name: "Advanced RAG System"
  version: "2.0.0"
  debug: false
  log_level: "INFO"
  max_workers: 4

# Document Processing
document_processing:
  chunking:
    default_strategy: "hybrid"
    strategies:
      recursive:
        chunk_size: 1000
        chunk_overlap: 200
      sentence:
        chunk_overlap: 50
        tokens_per_chunk: 256
      semantic:
        similarity_threshold: 0.7
        max_chunk_size: 500
      hierarchical:
        max_paragraph_size: 500
        sentence_group_size: 400
  
  multimodal:
    extract_images: true
    extract_tables: true
    image_captioning: true
    table_methods: ["camelot", "tabula", "pytesseract"]

# Embedding Models
embeddings:
  dense_models:
    default: "all-mpnet-base-v2"
    alternatives:
      - "all-MiniLM-L6-v2"
      - "all-distilroberta-v1"
  
  dpr_models:
    question_encoder: "facebook/dpr-question_encoder-single-nq-base"
    context_encoder: "facebook/dpr-ctx_encoder-single-nq-base"
  
  cross_encoder:
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

# Retrieval Strategies
retrieval:
  default_strategy: "hybrid"
  default_k: 5
  max_k: 50
  
  strategies:
    dense_only:
      weight: 1.0
    sparse_only:
      weight: 1.0
      max_features: 10000
    hybrid:
      dense_weight: 0.6
      sparse_weight: 0.4
      rerank: true
    dpr:
      weight: 1.0
    multi_vector:
      dense_weight: 0.4
      dpr_weight: 0.4
      sparse_weight: 0.2

# Query Processing
query_processing:
  classification:
    enabled: true
    complexity_threshold: 0.7
  
  analysis:
    extract_entities: true
    determine_intent: true
    suggest_strategy: true
  
  safety_checks:
    enabled: true
    toxicity_threshold: 0.1
    confidence_threshold: 0.7
    relevance_threshold: 0.5

# Response Generation
generation:
  openai:
    model: "gpt-3.5-turbo"
    max_tokens: 1000
    temperature: 0.1
    timeout: 30
  
  quality_checks:
    enabled: true
    min_grounding_score: 0.5
    max_response_length: 2000
  
  confidence_calculation:
    weights:
      retrieval_scores: 0.3
      quality_score: 0.4
      num_documents: 0.2
      strategy_reliability: 0.1

# Memory Management
memory:
  max_history: 100
  max_feedback: 1000
  save_interval: 10  # queries
  memory_file: "rag_memory.pkl"
  
  similarity_search:
    enabled: true
    threshold: 0.5
    max_results: 3

# Vector Database
vector_db:
  chromadb:
    collection_prefix: "advanced_rag"
    persist_directory: "./chroma_db"
    max_batch_size: 1000

# Evaluation
evaluation:
  metrics:
    - "precision_at_k"
    - "recall_at_k"
    - "f1_score"
    - "mrr"
    - "answer_relevancy"
    - "context_relevancy"
    - "faithfulness"
  
  benchmark:
    test_queries_file: "benchmark_queries.txt"
    ground_truth_file: "ground_truth.json"
    run_interval: "weekly"

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 1
  
  cors:
    allow_origins: ["*"]
    allow_methods: ["*"]
    allow_headers: ["*"]
    allow_credentials: true
  
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst_size: 10

# Streamlit Configuration
streamlit:
  page_title: "Advanced RAG System"
  page_icon: "🤖"
  layout: "wide"
  
  features:
    document_upload: true
    strategy_selection: true
    analytics_dashboard: true
    query_analysis: true
    visualization: true

# Visualization
visualization:
  embedding_plots:
    enabled: true
    dimensions: 3
    max_points: 1000
  
  performance_plots:
    enabled: true
    update_interval: 60  # seconds
  
  analytics_plots:
    enabled: true
    color_palette: "Set3"

# Monitoring and Logging
monitoring:
  enabled: true
  metrics_file: "metrics.json"
  log_file: "rag_system.log"
  
  performance_tracking:
    response_time: true
    success_rate: true
    query_patterns: true
    user_feedback: true
  
  alerts:
    enabled: false
    error_threshold: 0.1
    response_time_threshold: 10.0

# Security
security:
  guardrails:
    enabled: true
    toxicity_model: "unitary/toxic-bert"
    hallucination_detection: true
  
  input_validation:
    max_query_length: 1000
    allowed_file_types: [".pdf", ".txt", ".docx"]
    max_file_size_mb: 50

# Performance Optimization
performance:
  caching:
    enabled: true
    cache_size: 1000
    ttl_seconds: 3600
  
  async_processing:
    enabled: true
    max_concurrent_queries: 10
  
  gpu:
    enabled: false  # Set to true if GPU available
    device: "cuda:0"

# File Paths
paths:
  documents: "./documents/"
  uploads: "./uploads/"
  models: "./models/"
  cache: "./cache/"
  logs: "./logs/" 